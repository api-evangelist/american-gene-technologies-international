apis:
- aid: american-gene-technologies-international:content-api
  name: American Gene Technologies Content API
  description: >-
    The anonymously readable WordPress REST API served from https://www.americangene.com/wp-json.
    It exposes American Gene Technologies' corporate content as structured JSON across 23 registered
    namespaces and 576 routes, of which this profile models the 68 read operations that were verified
    to return data without credentials: the gene therapy reference entries (4), the patent portfolio
    (53), news releases (64), in-the-news press coverage (75), blog posts (106), archived newsletters
    (18), the scientific and clinical advisory board (7), open positions, company milestones, the
    video library and video series, the Young Minds education series, 72 corporate pages, the
    2,997-item media library, the fifteen associated taxonomies, cross-content search over 409
    indexed items, the post-type/taxonomy/status discovery endpoints, and the oEmbed 1.0 provider
    endpoint. This is not a developer product AGT markets — it is the corporate site's own content
    surface, registered at /wp-json/ by WordPress and Yoast/Jetpack/Gravity Forms plugins, recorded
    here because it is a real, live, agent-reachable API on the company domain.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.americangene.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - gene-therapy
  - patents
  - news
  x-origin: platform-default
  x-origin-note: >-
    Provided by WordPress core and its plugins, not authored or marketed by American Gene
    Technologies. AGT-specific custom post types (gene_therapies, patent, news-releases,
    in-the-news, blog, agt_advisors, agtjobs, agt-newsletters, milestones, videos, video_series,
    young_minds) were registered with show_in_rest by the site build, so the content itself is
    first-party even though the API framing is not.
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline on 2026-08-06 from two sources the site
    publishes anonymously: the route index at https://www.americangene.com/wp-json/ (576 routes
    across 23 namespaces — oembed/1.0, wpe_sign_on_plugin/v1, akismet/v1, jetpack/v4, leadin/v1,
    ninjatables/v2, the_grid/v1, yoast/v1, wpcom/v2, wpcom/v3, gravityforms/v2, gf/v2,
    wp-mail-smtp/v1, jetpack-boost/v1, my-jetpack/v1, bsf-core/v1, font-awesome/v1, wp/v2,
    wp-site-health/v1, wp-block-editor/v1 and the jetpack sub-namespaces) and the per-route OPTIONS
    self-description, which supplies every parameter and item schema verbatim. Only operations
    verified to return data anonymously are modelled; every write route and the entire plugin
    administration surface is excluded. The Gravity Forms surface at /wp-json/gf/v2/forms returned
    401 anonymously and is not modelled. No MCP namespace is registered on this site
    (/wp-json/mcp returned 404), so no MCPServer pointer is emitted. AGT publishes no developer
    documentation, API reference, getting-started guide, changelog or support channel for this
    surface, so no Documentation / APIReference / GettingStarted / ChangeLog pointers are emitted;
    the humanURL above is the upstream WordPress REST API Handbook that defines the wp/v2 contract.
