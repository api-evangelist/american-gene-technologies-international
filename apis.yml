aid: american-gene-technologies-international
name: American Gene Technologies
description: >-
  American Gene Technologies International Inc. (AGT) is a privately held gene and cell therapy
  company founded in 2007 and headquartered in a 27,000 square foot laboratory and office at
  9713 Key West Avenue, 5th Floor, Rockville, Maryland, across from the National Cancer Institute
  campus and the Johns Hopkins Shady Grove campus. AGT operates a proprietary lentiviral
  gene-delivery platform for the rapid development of cell and gene therapies against infectious
  disease, cancer and inherited disorders, and runs a Vector Production Facility and a Translational
  Science Laboratory on site. Its programs include AGT103-T, an autologous cell therapy aimed at a
  functional cure for HIV, a lentivirus vector-based gene therapy for phenylketonuria (PKU), and a
  gamma-delta T cell immuno-oncology program (ImmunoTox) targeting hepatocellular carcinoma and
  other solid tumors. AGT publishes no product API, no developer portal and no API documentation,
  and operates no developer program. The only machine-readable surface reachable without
  credentials is the WordPress REST content API behind americangene.com, catalogued in this
  profile — a read-only content surface exposing the company's gene therapy reference entries,
  patent portfolio, news releases, press coverage, blog, newsletters, advisory board, milestones,
  media library and video series as structured JSON.
