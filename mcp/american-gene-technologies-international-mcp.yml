note: 'American Gene Technologies publishes NO Model Context Protocol server. This was verified, not assumed
  - /wp-json/mcp returns 404 rest_no_route, no mcp namespace appears among the 23 registered in the API
  index at https://www.americangene.com/wp-json/, /.well-known/mcp.json returns 404 on both hosts, and
  the WordPress MCP Adapter plugin (which supplies /wp-json/mcp/ on some WordPress sites in this catalogue)
  is not installed. No MCPServer pointer is emitted in apis.yml, and none should be until AGT actually
  publishes one.

  The tools below are a DERIVED CANDIDATE mapping only - what a read-only MCP server over this content
  surface would expose if someone built one, with each tool bound to a real operationId in the derived
  OpenAPI so its input schema is the operation''s real parameter set. This is a design starting point,
  not a claim about AGT.'
