- {name: PagesHivTag, rest_base: pages-hiv-tag, applies_to: [Page, Milestone], terms: 1}
- {name: NewsletterHivTag, rest_base: newsletter-hiv-tag, applies_to: [Newsletter], terms: 1}
- {name: FeaturedMediaTerm, rest_base: featured-media, applies_to: [BlogPost, InTheNews, NewsRelease], terms: 0}

cross_cutting:
  search:
    path: /wp/v2/search
    indexed_items: 409
    returns: 'Lightweight stubs - id, title, url, type, subtype, _links.self (embeddable).'
    note: >-
      The single entry point that spans entities. Resolve the full object by following
      _links.self, which points at the correct typed collection.
  discovery:
    types: /wp/v2/types
    taxonomies: /wp/v2/taxonomies
    statuses: /wp/v2/statuses
    note: >-
      The graph is self-describing at runtime - /wp/v2/types names every rest_base and the
      taxonomies bound to it, and each route's OPTIONS response carries the item JSON Schema.
