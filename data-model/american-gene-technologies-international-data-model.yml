generated: '2026-08-06'
method: derived
source: >-
  openapi/american-gene-technologies-international-content-openapi.yml, the registered post types
  and taxonomies published at /wp-json/wp/v2/types and /wp-json/wp/v2/taxonomies, and the _links
  relations observed on live items (2026-08-06).
note: >-
  The entity graph of the American Gene Technologies Content API. Identity is a site-scoped integer
  WordPress post ID (there are no prefixed IDs). Relationships are expressed two ways in the payload -
  as integer arrays on taxonomy-named fields (for example gene_therapy_phase - [61]) and as HAL-style
  _links entries (wp:term, wp:featuredmedia, author, wp:attachment). Item counts are the live
  X-WP-Total values observed on 2026-08-06.

identity:
  scheme: integer
  field: id
  scope: site
  note: >-
    IDs are not contiguous and are shared across post types. slug is the stable human-readable
    identifier and is what the public URLs use.

entities:
- name: GeneTherapy
  rest_base: gene_therapies
  path: /wp/v2/gene_therapies
  count: 4
  description: >-
    Reference entries for approved gene therapies (Zolgensma, Yescarta, Kymriah, Zynteglo) used as
    educational context on the AGT site.
  key_fields: [id, slug, title, content, link, date, modified, status, gene_therapy_phase]
  relationships:
  - type: has_many
    target: GeneTherapyPhase
    via: gene_therapy_phase
    link_rel: wp:term
  - type: has_many
    target: Media
    via: _links.wp:attachment

- name: Patent
  rest_base: patent
  path: /wp/v2/patent
  count: 53
  description: AGT patent portfolio entries.
  key_fields: [id, slug, title, content, link, date, modified, featured_media]
