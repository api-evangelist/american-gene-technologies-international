- {name: VideoSeriesCategory, rest_base: video_series_categories, applies_to: [VideoSeriesEpisode], terms: 1}
- {name: YoungMindCategory, rest_base: young_mind_categories, applies_to: [YoungMinds], terms: 1}
- {name: Category, rest_base: categories, applies_to: [Post], terms: 2}
