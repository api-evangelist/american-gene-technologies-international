openapi: 3.1.0
info:
  title: American Gene Technologies Content API
  version: wp/v2
  summary: The anonymously readable WordPress REST content API behind americangene.com.
  description: 'Read-only catalogue of the public WordPress REST API served from https://www.americangene.com/wp-json.
    It exposes American Gene Technologies'' corporate content as structured JSON: the gene therapy reference
    entries, the 53-item patent portfolio, 64 news releases, 75 in-the-news press items, 106 blog posts,
    18 archived newsletters, the scientific and clinical advisory board, open positions, company milestones,
    the video library and video series, the Young Minds education series, 72 corporate pages, the 2,997-item
    media library, the associated taxonomies, cross-content search and the oEmbed 1.0 provider endpoint.


    This is NOT a developer product American Gene Technologies markets, and there is no AGT developer
    portal, API reference, getting-started guide or support channel for it. It is the company site''s
    own content surface, registered at /wp-json/ by WordPress and verified by API Evangelist to return
    data without credentials. Only operations that returned data anonymously are modelled here; every
    write route and the whole plugin-administration surface is excluded. Parameter and response schemas
    are taken verbatim from the OPTIONS self-description each route publishes.


    The upstream contract for the wp/v2 namespace is defined by the WordPress REST API Handbook.'
  contact:
    name: American Gene Technologies
    url: https://www.americangene.com/contact-us/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://www.americangene.com/wp-json/ route index + per-route OPTIONS self-description
  x-harvested: '2026-08-06'
externalDocs:
  description: WordPress REST API Handbook — the upstream contract for the wp/v2 namespace.
  url: https://developer.wordpress.org/rest-api/
servers:
- url: https://www.americangene.com/wp-json
  description: Production
tags:
- name: AGT Jobs
- name: AGT Newsletters
- name: Blogs
- name: Discovery
- name: Gene Therapies
- name: In The News
- name: Media
- name: Milestones
- name: News Releases
- name: Pages
- name: Patents
- name: Posts
- name: Scientific And Clinical Advisors
- name: Search
- name: Taxonomies
- name: Video Series Videos
- name: Videos
- name: Young Minds
- name: oEmbed
paths:
  /:
    get:
      operationId: get_api_index
      summary: Get the API index
      description: 'The WordPress REST API discovery document for americangene.com: site name and description,
        registered namespaces, the full route index, supported authentication methods and site branding.'
      tags:
      - Discovery
      parameters:
      - name: namespace
        in: query
        required: false
        description: Limit the index to a single registered namespace.
        schema:
          type: string
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - help
          - embed
          default: view
      responses:
        '200':
          description: The API index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'
  /oembed/1.0/embed:
    get:
      operationId: get_oembed
      summary: Get oEmbed data for a URL on this site
      description: oEmbed 1.0 provider endpoint. Returns embeddable metadata (title, author, thumbnail,
        HTML) for any americangene.com URL.
      tags:
      - oEmbed
      parameters:
      - name: url
        in: query
        required: true
        description: The URL of the resource for which to fetch oEmbed data.
        schema:
          type: string
          format: uri
      - name: format
        in: query
        required: false
        description: The oEmbed format to use.
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - name: maxwidth
        in: query
        required: false
        description: The maximum width of the embed frame in pixels.
        schema:
          type: integer
          default: 600
      responses:
        '200':
          description: oEmbed response document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /wp/v2/agt-newsletters:
    get:
      operationId: list_agt_newsletters
      summary: List AGT Newsletters
      description: Archived AGT newsletters.
      tags:
      - AGT Newsletters
      parameters:
      - name: context
        in: query
        required: false
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        required: false
        description: Current page of the collection.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        required: false
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: after
        in: query
        required: false
        description: Limit response to posts published after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_after
        in: query
        required: false
        description: Limit response to posts modified after a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        description: Limit response to posts published before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: modified_before
        in: query
        required: false
        description: Limit response to posts modified before a given ISO8601 compliant date.
        schema:
          type: string
          format: date-time
      - name: exclude
        in: query
        required: false
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: include
        in: query
        required: false
        description: Limit result set to specific IDs.
        schema:
          type: array
          default: []
          items:
            type: integer
      - name: menu_order
        in: query
        required: false
        description: Limit result set to posts with a specific menu_order value.
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Offset the result set by a specific number of items.
        schema:
          type: integer
      - name: order
        in: query
        required: false
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: orderby
        in: query
        required: false
        description: Sort collection by post attribute.
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          - menu_order
          default: date
      - name: search_columns
        in: query
        required: false
        description: Array of column names to be searched.
        schema:
          type: array
          default: []
          items:
            enum:
            - post_title
            - post_content
            - post_excerpt
            type: string
      - name: slug
        in: query
        required: false
        description: Limit result set to posts with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      - name: newsletter-hiv-tag
        in: query
        required: false
        description: Limit result set to items with specific terms assigned in the newsletter-hiv-tag
          taxonomy.
        schema:
          type:
          - object
          - array
      - name: newsletter-hiv-tag_exclude
        in: query
        required: false
        description: Limit result set to items except those with specific terms assigned in the newsletter-hiv-tag
          taxonomy.
        schema:
          type:
          - object
          - array
      responses:
        '200':
          description: A page of AGT Newsletters.
          headers:
            X-WP-Total:
              description: Total number of items in the collection.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgtNewsletters'
        '400':
          $ref: '#/components/responses/BadRequest'
